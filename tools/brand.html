<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raza · brand assets</title>
  <!-- Dev tool: renders the link-preview image and app icons. Run: npm run brand:assets -->
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cinzel:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .og {
      position: relative;
      width: 1200px; height: 630px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 470px;
      align-items: center;
      padding: 0 70px 0 96px;
      background:
        radial-gradient(60% 90% at 78% 55%, rgba(214, 160, 80, 0.3), transparent 62%),
        radial-gradient(90% 90% at 20% 0%, #24160b, #0a0705 62%, #050302);
      color: #ecd49a;
    }
    .og::after { content: ''; position: absolute; inset: 22px; border: 1px solid rgba(201, 164, 92, 0.35); pointer-events: none; }
    .og__ar { font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: 110px; line-height: 1; background: linear-gradient(100deg, #93672a, #f2dca1 45%, #b5873d 70%, #e6c987); -webkit-background-clip: text; color: transparent; }
    .og__word { margin-top: 8px; font-family: 'Cinzel', serif; font-size: 96px; letter-spacing: 0.2em; line-height: 1; }
    .og__sub { margin-top: 18px; font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: 0.55em; color: #c9a45c; }
    .og__rule { width: 90px; height: 1px; margin: 34px 0 30px; background: linear-gradient(90deg, #c9a45c, transparent); }
    .og__line { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; line-height: 1.45; color: #eadfca; max-width: 560px; }
    .og__line b { font-weight: 400; color: #ecd49a; }
    .og img { width: 470px; filter: drop-shadow(0 40px 50px rgba(0, 0, 0, 0.7)); }

    .icon {
      --s: 512px;
      width: var(--s); height: var(--s);
      display: grid; place-items: center;
      background: radial-gradient(70% 70% at 50% 35%, #2a190b, #0a0705 70%);
    }
    .icon span {
      font-family: 'Cinzel', serif; font-weight: 500;
      font-size: calc(var(--s) * 0.56); line-height: 1;
      transform: translateY(4%);
      background: linear-gradient(160deg, #f3dea4, #c1913f 45%, #f2dca1 62%, #9d6c28);
      -webkit-background-clip: text; color: transparent;
    }
    .icon::before { content: ''; position: absolute; width: calc(var(--s) * 0.8); height: calc(var(--s) * 0.8); border-radius: 50%; border: calc(var(--s) * 0.012) solid rgba(201, 164, 92, 0.55); }
  </style>
</head>
<body>
  <div class="og" id="og">
    <div>
      <div class="og__ar">رضا</div>
      <div class="og__word">RAZA</div>
      <div class="og__sub">PERFUME · SINCE 1986</div>
      <div class="og__rule"></div>
      <p class="og__line">Rare attars, ouds &amp; perfumes from the House of Raza. <b>95 fragrances. Order on WhatsApp.</b></p>
    </div>
    <img src="/media/products/house-base.webp" alt="" />
  </div>
  <div class="icon" id="icon" style="position: relative"><span>R</span></div>
</body>
</html>
